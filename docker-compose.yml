services:
  app:
    image: ${ALERTSNEST_IMAGE:-ghcr.io/sniffy1988/alertsnest:latest}
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/data/alerts.db
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - alerts-data:/data
    depends_on:
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 40s

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    # Uncomment to use the host Ollama UI / CLI against this container:
    # ports:
    #   - "11434:11434"

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama"]
    command: ["pull", "${OLLAMA_MODEL:-qwen3.5:2b-mlx}"]
    restart: on-failure

volumes:
  alerts-data:
  ollama-data:
